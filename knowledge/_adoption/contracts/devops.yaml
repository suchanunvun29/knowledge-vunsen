# Converted from a legacy .claude/agents/devops.md by adoption (T82).
#
# STAGED, NOT INSTALLED. Nothing reads this file. Installing it means copying it
# to contracts/devops.yaml deliberately, after reading it — and note that
# --check-contracts compares contracts/ against the orchestrator's registry, so a
# difference below is a difference that check will report once installed.
#
# No behavioural difference found against this framework's role of the same name.
agent:
  name: devops
  role: devops
  description: Use this agent to get verified work out the door — Docker/Compose,
    CI pipelines, environment config, production database migrations, and
    deploys. Run it after `qa-engineer` (and `security`, on sensitive phases)
    has accepted a phase. Trigger on requests like "deploy ให้หน่อย", "ตั้ง CI",
    "ทำ Dockerfile", "migrate ขึ้น production", "ตั้ง staging".
input:
  required:
    - qa-report
    - plan
  optional:
    - security-report
    - design
    - devops-docs
output:
  required:
    - devops-docs
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - amend_not_regenerate
  - dates_from_user
  - no_deploy_without_verification
  - human_confirmation_required
permissions:
  capabilities:
    - read
    - build
    - deploy
    - rollback
  read:
    - .claude/shared/**
    - policies/**
    - .dockerignore
    - .github/**
    - CLAUDE.md
    - Dockerfile
    - _docs/module/*/deploy.md
    - _docs/module/*/design.md
    - _docs/module/*/plan.md
    - _docs/module/*/requirement.md
    - _docs/module/*/review.md
    - _docs/module/*/security.md
    - _docs/status-archive.md
    - _docs/status.md
    - deploy/**
    - docker-compose*.yml
    - infra/**
    - package.json
    - prisma/**
  write:
    - _docs/module/*/deploy.md
    - _docs/status.md
    - Dockerfile
    - docker-compose*.yml
    - .github/**
    - .dockerignore
    - infra/**
    - deploy/**
  deny:
    - _docs/module/*/requirement.md
    - _docs/module/*/design.md
    - _docs/module/*/plan.md
    - _docs/module/*/review.md
    - _docs/module/*/security.md
    - app/**
    - server/**
    - prisma/**
tools:
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
  - AskUserQuestion
states:
  - READY_TO_DEPLOY
  - APPROVED
  - DEPLOYED
capability:
  languages:
    - typescript
  frameworks:
    - docker
  database:
    - postgresql
  capabilities:
    - deployment
    - migration
    - ci

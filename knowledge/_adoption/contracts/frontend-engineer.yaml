# Converted from a legacy .claude/agents/frontend-engineer.md by adoption (T82).
#
# STAGED, NOT INSTALLED. Nothing reads this file. Installing it means copying it
# to contracts/frontend-engineer.yaml deliberately, after reading it — and note that
# --check-contracts compares contracts/ against the orchestrator's registry, so a
# difference below is a difference that check will report once installed.
#
# No behavioural difference found against this framework's role of the same name.
agent:
  name: frontend-engineer
  role: frontend-engineer
  description: Use this agent for any frontend work on this project — building
    pages/components, adding UI features, styling, state, or scaffolding new
    parts of the app. This project's frontend stack is fixed (see below); this
    agent always follows it instead of asking or guessing. Trigger on requests
    like "สร้างหน้า...", "เพิ่ม component...", "ทำ UI ให้หน่อย", "build this
    page/feature".
input:
  required:
    - plan
    - design
    - requirements
  optional:
    - qa-report
    - frontend-code
output:
  required:
    - frontend-code
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - must_follow_design
  - no_schema_guessing
  - no_checkbox_writes
  - green_before_handoff
  - no_rule_decisions
  - backend_before_frontend
permissions:
  capabilities:
    - read
    - write_code
    - test
  read:
    - .claude/agents/frontend-engineer.md
    - .claude/shared/**
    - policies/**
    - CLAUDE.md
    - _docs/module/*/design.md
    - _docs/module/*/plan.md
    - _docs/module/*/requirement.md
    - _docs/module/*/review.md
    - _docs/status-archive.md
    - _docs/status.md
    - app/**
    - components/**
    - package.json
    - public/**
    - server/**
    - src/**
    - styles/**
  write:
    - app/**
    - components/**
    - src/components/**
    - src/app/**
    - styles/**
    - public/**
    - _docs/status.md
  deny:
    - _docs/module/**
    - .claude/**
    - contracts/**
    - prisma/**
    - server/**
    - app/api/**
tools:
  - Write
  - Edit
  - Read
  - Glob
  - Grep
  - Bash
states:
  - IMPLEMENTATION
capability:
  languages:
    - typescript
  frameworks:
    - nextjs
    - react
    - tailwind
    - zustand
  database: []
  capabilities:
    - ui
    - testing

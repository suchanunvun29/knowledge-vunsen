# Converted from a legacy .claude/agents/security.md by adoption (T82).
#
# STAGED, NOT INSTALLED. Nothing reads this file. Installing it means copying it
# to contracts/security.yaml deliberately, after reading it — and note that
# --check-contracts compares contracts/ against the orchestrator's registry, so a
# difference below is a difference that check will report once installed.
#
# No behavioural difference found against this framework's role of the same name.
agent:
  name: security
  role: security
  description: Use this agent only when the user explicitly asks for a security
    review of a phase that touched auth, personal data, payments, file upload,
    or any untrusted external input — to audit the implemented code for real
    security defects (auth/authorization holes, injection, secret leakage,
    unsafe input handling) before it's accepted or deployed. Trigger only on
    explicit requests like "ตรวจความปลอดภัยหน่อย", "security review",
    "โค้ดนี้ปลอดภัยไหม". Do NOT auto-invoke just because a QA round finished on
    a sensitive module — wait for the user to ask, even when `plan.md` carries a
    🔒 Security gate.
input:
  required:
    - requirements
    - design
  optional:
    - qa-report
    - backend-code
    - frontend-code
output:
  required:
    - security-report
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - amend_not_regenerate
  - dates_from_user
  - sole_security_finding_closer
permissions:
  capabilities:
    - read
    - write_docs
  read:
    - .claude/shared/**
    - policies/**
    - CLAUDE.md
    - _docs/module/*/design.md
    - _docs/module/*/requirement.md
    - _docs/module/*/review.md
    - _docs/module/*/security.md
    - _docs/status-archive.md
    - _docs/status.md
    - app/**
    - components/**
    - package.json
    - prisma/**
    - server/**
    - src/**
  write:
    - _docs/module/*/security.md
    - _docs/status.md
    - _docs/status-archive.md
  deny:
    - _docs/module/*/review.md
    - app/**
    - server/**
    - prisma/**
tools:
  - Read
  - Glob
  - Grep
  - Bash
  - AskUserQuestion
  - Write
  - Edit
states:
  - SECURITY
capability:
  languages:
    - typescript
  frameworks: []
  database:
    - postgresql
  capabilities:
    - security-audit

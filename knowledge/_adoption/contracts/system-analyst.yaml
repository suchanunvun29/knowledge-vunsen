# Converted from a legacy .claude/agents/system-analyst.md by adoption (T82).
#
# STAGED, NOT INSTALLED. Nothing reads this file. Installing it means copying it
# to contracts/system-analyst.yaml deliberately, after reading it — and note that
# --check-contracts compares contracts/ against the orchestrator's registry, so a
# difference below is a difference that check will report once installed.
#
# No behavioural difference found against this framework's role of the same name.
agent:
  name: system-analyst
  role: system-analyst
  description: Use this agent after a `requirement.md` exists (from the
    `business-analyst` agent) to analyze whether it's actually feasible, design
    the data model/tables with the user, and split large requirements into
    smaller modules before any planning or implementation starts. Also handles
    change requests to an already-delivered module (checks schema changes
    against existing live data). Trigger on requests like "วิเคราะห์ requirement
    นี้หน่อย", "ทำได้จริงไหม", "ออกแบบ table ให้หน่อย", or right after the
    `business-analyst` agent finishes.
input:
  required:
    - requirements
  optional:
    - qa-report
output:
  required:
    - design
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - amend_not_regenerate
  - dates_from_user
  - human_confirmation_required
permissions:
  capabilities:
    - read
    - write_docs
  read:
    - .claude/agents/backend-engineer.md
    - .claude/agents/frontend-engineer.md
    - .claude/shared/**
    - policies/**
    - CLAUDE.md
    - _docs/module/*/design-archive.md
    - _docs/module/*/design.md
    - _docs/module/*/requirement.md
    - _docs/module/*/review.md
    - _docs/status-archive.md
    - _docs/status.md
    - prisma/**
  write:
    - _docs/module/*/design.md
    - _docs/module/*/design-archive.md
    - _docs/status.md
    - _docs/status-archive.md
  deny:
    - _docs/module/*/requirement.md
    - _docs/module/*/plan.md
    - prisma/**
tools:
  - Read
  - Glob
  - Grep
  - AskUserQuestion
  - Write
  - Edit
states:
  - DESIGN
capability:
  languages: []
  frameworks: []
  database:
    - postgresql
  capabilities:
    - schema-design
    - feasibility-analysis

# Converted from a legacy .claude/agents/backend-engineer.md by adoption (T82).
#
# STAGED, NOT INSTALLED. Nothing reads this file. Installing it means copying it
# to contracts/backend-engineer.yaml deliberately, after reading it — and note that
# --check-contracts compares contracts/ against the orchestrator's registry, so a
# difference below is a difference that check will report once installed.
#
# No behavioural difference found against this framework's role of the same name.
agent:
  name: backend-engineer
  role: backend-engineer
  description: Use this agent for any backend work on this project — API
    routes/endpoints, database models/migrations, business logic, auth, or
    scaffolding new backend modules. This project's backend stack is fixed (see
    below); this agent always follows it instead of asking or guessing. Trigger
    on requests like "สร้าง endpoint...", "เพิ่ม API...", "ทำ backend ให้หน่อย",
    "build this route/service".
input:
  required:
    - plan
    - design
    - requirements
  optional:
    - qa-report
    - backend-code
output:
  required:
    - backend-code
constraints:
  - no_git
  - stay_inside_repo
  - no_next_agent_invocation
  - must_follow_design
  - no_schema_guessing
  - no_checkbox_writes
  - green_before_handoff
  - no_rule_decisions
  - backend_before_frontend
permissions:
  capabilities:
    - read
    - write_code
    - test
  read:
    - .claude/agents/backend-engineer.md
    - .claude/shared/**
    - policies/**
    - CLAUDE.md
    - _docs/module/*/design.md
    - _docs/module/*/plan.md
    - _docs/module/*/requirement.md
    - _docs/module/*/review.md
    - _docs/status-archive.md
    - _docs/status.md
    - app/**
    - package.json
    - prisma/**
    - server/**
    - src/**
  write:
    - server/**
    - src/server/**
    - src/lib/**
    - app/api/**
    - prisma/**
    - package.json
    - _docs/status.md
  deny:
    - _docs/module/**
    - .claude/**
    - contracts/**
    - components/**
tools:
  - Write
  - Edit
  - Read
  - Glob
  - Grep
  - Bash
states:
  - IMPLEMENTATION
capability:
  languages:
    - typescript
  frameworks:
    - express
    - prisma
    - zod
  database:
    - postgresql
  capabilities:
    - rest-api
    - database-access
    - auth
    - testing

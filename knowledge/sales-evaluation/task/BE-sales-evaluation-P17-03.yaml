body: '- [ ] [backend] ใส่การกรองใน endpoint รับ `salespersonId` เป็นพารามิเตอร์ทุกตัวของ Phase 4–7 (`GET /kpi/:salespersonId`, `GET /kpi/:salespersonId/drill-down/:metric`, `GET /kpi/:salespersonId/trend`, `GET /coaching-insights/:salespersonId`, `GET /reports/individual/:salespersonId` + export) — ถ้า `salespersonId ∉ visibleSalespersonIds` → `403` เดียวกันทั้งกรณี "ไม่มีสิทธิ์" และ "ไม่มีคนนี้" ห้ามคืน `200` พร้อมข้อมูลว่าง'

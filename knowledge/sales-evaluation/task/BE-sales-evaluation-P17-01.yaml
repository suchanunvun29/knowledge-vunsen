body: "- [ ] [backend] เขียน `resolveViewerScope(user)` เป็น**ฟังก์ชันเดียวของทั้งระบบ** ตาม Data Visibility Rules ข้อ 2 ทุกตัวอักษร — คืน `{ canSeeEveryone, selfSalespersonId, supervisedTerritoryIds, memberTerritoryIds }`, ใช้ \"ณ วันนี้\" เสมอ (ไม่ใช่ ณ งวดที่กำลังดู) — วางเป็น shared module ที่ทุก service import ใช้ ห้ามกระจาย `if (role === 'MANAGER')` ไปทั่วโค้ด"

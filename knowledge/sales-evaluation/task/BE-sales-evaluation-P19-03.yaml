body: "- [ ] [backend] Service `REPLACE_PERIOD`: ตรวจก่อนแตะข้อมูลว่าทุกแถวที่ผ่าน validate อยู่ใน `P` (เซ็ตงวดที่เลือก) เท่านั้น — มีแถวนอก `P` → `ERROR PERIOD_OUT_OF_SCOPE` ยกเลิกทั้งไฟล์ `status = FAILED` → upsert ตาม `rowKey` เหมือนเดิมทุกประการ → หา `SalesLine` ทุกแถวที่ `(year, month) ∈ P` และ `rowKey ∉ K` → คัดลอกลง `SalesLineArchive` (`reason = SUPERSEDED_BY_REIMPORT`) **พร้อม `SalesLineCredit` ทั้งหมดของแถวนั้นลงใน `payload`** → ลบออกจาก `SalesLine` จริง (cascade ลบ `SalesLineCredit`) → นับเป็น `removedRows` — ทั้งหมดในทรานแซกชันเดียว ล้มขั้นใดก็ rollback ทั้งชุด"

body: "- [ ] [backend] Migration: เพิ่ม `Territory` (`name` unique, `code` unique nullable, `regionId` nullable — ป้ายอ้างอิงเท่านั้น ห้ามใช้แทน `Region` ในสูตรศักยภาพ, `sortOrder`, `isActive`, `note`), `TerritoryAssignment` **นิยามใหม่** (`territoryId`, `salespersonId`, **`isSupervisor Boolean @default(false)`** — **ห้ามสร้าง `enum TerritoryRole` (`OWNER`/`SUPERVISOR`) เด็ดขาด ถูกยกเลิกแล้ว 2026-08-19**, `effectiveFrom`, `effectiveTo`, `assignedById`, `note`, `@@unique([territoryId, salespersonId, effectiveFrom])`, `@@index([salespersonId, isSupervisor, effectiveTo])`), enum `TerritoryLinkSource` (`INFERRED`/`MANUAL`), `HospitalTerritoryChange` (audit อย่างเดียว ไม่มี relation ออก) ลง `schema.prisma` ตาม Data Model ส่วนขยายรอบที่ 3 ทุกตัวอักษร — **ห้ามสร้าง `TerritoryAssignment` แบบเดิมที่ Phase 9 เขียนไว้ก่อนหน้านี้ นี่คือของจริงตัวเดียวที่ implement** ดู Sequencing Notes"

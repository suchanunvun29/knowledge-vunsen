body: "- [ ] [backend] Migration: เพิ่ม enum `ImportMode` (`APPEND`/`REPLACE_PERIOD`/`PERIOD_DELETE`, default `APPEND`), enum `ArchiveReason` (`SUPERSEDED_BY_REIMPORT`/`MANUAL_PERIOD_DELETE`), model `SalesLineArchive` (`salesLineId`, `rowKey`, `year`, `month`, `total`, `reason`, `removedByBatchId`, `removedAt`, `payload Json`), เพิ่ม 4 คอลัมน์บน `ImportBatch` (`mode`, `targetPeriods Json?`, `removedRows Int @default(0)`, `confirmedById String?`) + back-relation `archivedLines` ลง `schema.prisma` ตาม Data Model ส่วนขยายรอบที่ 3 ทุกตัวอักษร — **ไม่มีคอลัมน์ใหม่บน `SalesLine`** (ตั้งใจ ห้ามเพิ่ม `supersededAt`/`isDeleted`)"

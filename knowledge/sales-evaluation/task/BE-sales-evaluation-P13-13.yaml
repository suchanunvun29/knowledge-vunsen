body: '- [ ] [backend] **เพิ่ม 2026-08-19 (รอบที่ 3)** เพิ่มบล็อกกลุ่มเขตต่อท้ายรายงาน `GET /reports/territory-overview`: เขตสมาชิกของ `TerritoryGroup` ยังมีแถวของตัวเองตาม grain เดิม (1 แถว = 1 เขต) แต่ช่องเป้าแสดง "ไม่ได้ตั้งเป้าแยก (อยู่ในเป้ารวมของกลุ่ม X)" และ `REVENUE_VS_TARGET` = คำนวณไม่ได้ + เพิ่มแถว/บล็อกของกลุ่มเองต่อท้ายตาราง (ยอดรวม/เป้ารวม/%ถึงเป้าของกลุ่ม) — **ห้ามนับแถวกลุ่มรวมเข้ากับผลรวมยอดของตาราง** เพราะถูกนับในแถวเขตสมาชิกไปแล้ว'

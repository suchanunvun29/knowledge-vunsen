body: "- [ ] [backend] **เพิ่ม 2026-08-19 (รอบที่ 3)** Migration: เพิ่ม `TerritoryGroup` (`name` unique, `isActive`, `note`), `TerritoryGroupMember` (`groupId`, `territoryId` **`@unique`** — 1 เขตอยู่ได้ไม่เกิน 1 กลุ่ม, `@@unique([groupId, territoryId])`), เพิ่มค่า `TERRITORY_GROUP` ใน enum `TargetScope`, เพิ่มคอลัมน์ `Target.territoryGroupId` (nullable) + relation ไป `TerritoryGroup` + `@@unique([territoryGroupId, year, month])` ลง `schema.prisma` ตาม Data Model ส่วนขยายรอบที่ 3 ทุกตัวอักษร — มีไว้เก็บเป้าคู่เขต 14M (กท1+ภาคตะวันตก)/13M (กท2+ภาคกลาง) เท่านั้น (การตัดสินใจแถวที่ 26 กลับคำเดิม)"

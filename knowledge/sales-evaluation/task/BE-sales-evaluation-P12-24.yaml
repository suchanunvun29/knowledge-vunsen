body: "- [ ] [backend] **เพิ่ม 2026-08-19 (รอบที่ 3)** Endpoint `POST /territory-groups` / `PATCH /territory-groups/:id` (MANAGER เท่านั้น) — สร้าง/แก้กลุ่มเขต (`name`, `isActive`, `note`), `POST /territory-groups/:id/members` / `DELETE /territory-groups/:id/members/:territoryId` (MANAGER เท่านั้น) — เพิ่ม/ถอนเขตออกจากกลุ่ม (บังคับ `@unique` ทาง DB + validator ทาง service), `GET /territory-groups` — list กลุ่มทั้งหมดพร้อมเขตสมาชิก, `PUT /targets/group/:territoryGroupId/:year/:month` (MANAGER เท่านั้น) 🔒 — upsert เป้าระดับกลุ่ม (`scope = TERRITORY_GROUP`) พร้อม `TargetRevision`"

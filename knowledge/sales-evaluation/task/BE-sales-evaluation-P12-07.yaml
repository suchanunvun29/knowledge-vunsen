body: "- [ ] [backend] **Target re-scope**: เพิ่ม enum `TargetScope` (`TERRITORY`/`SALESPERSON`), เพิ่ม `Target.scope` (default `SALESPERSON` — ทำให้แถวเดิมย้ายมาได้โดยไม่ backfill), `Target.territoryId` (nullable, relation ไป `Territory`), เปลี่ยน `Target.salespersonId` เป็น nullable, เพิ่ม `@@unique([territoryId, year, month])` คู่กับ `@@unique([salespersonId, year, month])` เดิม — `TargetProductGroup`/`TargetRevision` ไม่เปลี่ยนโครงสร้าง"

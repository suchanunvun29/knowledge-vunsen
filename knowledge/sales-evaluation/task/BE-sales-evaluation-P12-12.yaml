body: "- [ ] [backend] สคริปต์ bootstrap เขตให้โรงพยาบาล 141 แห่งตาม Territory KPI Rules ข้อ 9: หา salesperson ที่มียอด `SalesLineCredit` สูงสุดต่อโรงพยาบาล (ไม่รวมคนที่ `excludedFromTerritoryTotals = true`) → ถ้ามี `TerritoryAssignment` ACTIVE เขตเดียว ตั้ง `territoryId`/`territorySource = INFERRED` ให้ทันที → ถ้าดูแลหลายเขต หรืออันดับ 2 ได้ยอด ≥30% ของอันดับ 1 ปล่อย `territoryId = null` และตีธงให้ผู้จัดการตัดสิน (ห้ามเลือกให้เอง) — สคริปต์ต้อง idempotent รันซ้ำได้"

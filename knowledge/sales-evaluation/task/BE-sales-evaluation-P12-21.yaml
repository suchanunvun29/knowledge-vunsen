body: "- [ ] [backend] **เพิ่ม 2026-08-19 (รอบที่ 3)** Service คำนวณเป้า/ยอดของกลุ่มเขตตาม Territory KPI Rules ข้อ 6 ส่วนขยาย: `revenue(G, งวด) = Σ revenue(T, งวด)` ของทุกเขตสมาชิก (สูตรข้อ 2 เดิม), `achievement(G) = revenue(G, งวด) ÷ Target(scope=TERRITORY_GROUP, G, งวด).revenueTarget × 100`, `derivedTarget` ของคนในกลุ่ม `= Target(G, งวด).revenueTarget ÷ activeOwnerCount(G, งวด)` โดย `activeOwnerCount(G)` **นับคนไม่ซ้ำ** ข้ามทุกเขตสมาชิกของ `G` (Tasanee ดูแล 2 เขตในกลุ่มเดียวกันนับเป็น 1 ไม่ใช่ 2) — ห้าม implement ครึ่งเดียว ต้องมีทั้งสูตรและ validator คู่กัน"

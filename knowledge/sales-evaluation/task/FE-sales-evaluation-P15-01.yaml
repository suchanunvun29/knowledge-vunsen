body: '- [ ] [frontend] หน้าอันดับสินค้ารายเขต — คอลัมน์บังคับ: รหัสสินค้า (`"—"` พร้อม tooltip เมื่อไม่มี) · ชื่อสินค้า · `Product type` · เขต · ผู้ดูแลเขต (หรือ "ยังไม่มีผู้ดูแล") + ยอดขาย/จำนวน, สินค้าขายได้ 0 ต่อท้ายพร้อม 2 ป้ายแยกกัน, บล็อก `personalBucket`, **คำเตือนบังคับถาวร** ตาม Product Master & Ranking Rules ข้อ 4 คำต่อคำ ("ทะเบียนสินค้าปัจจุบันสร้างจากประวัติการขาย รายการนี้จึงหมายถึงสินค้าที่เขตอื่นขายได้แต่เขตนี้ยังไม่ได้ขาย ไม่ใช่ทั้งแคตตาล็อกของบริษัท") ทั้งบนหน้าจอและไฟล์ export, ตัวเลือกช่วงเวลา, ปุ่ม Export'

body: '- [ ] [backend] Service คำนวณ `derivedTarget(sp, งวด)` สดตาม Territory KPI Rules ข้อ 6 — **ห้ามเขียนลงตาราง `Target`**: รวมเป้าของทุกเขตที่ `sp` มี `TerritoryAssignment` ACTIVE หารด้วย `activeOwnerCount(T, งวด)` ของแต่ละเขตแล้วรวม (**`activeOwnerCount` นับทุกแถวไม่ว่า `isSupervisor` เป็น `true` หรือ `false` — เพิ่ม 2026-08-19**), ถ้ามีแถว `Target(scope=SALESPERSON)` ของคนนั้นในงวดนั้น → ใช้แทนทั้งก้อน, เขตที่ `activeOwnerCount = 0` → เป้าก้อนนั้นแสดงแยกเป็น "เป้าของเขตที่ยังไม่มีผู้ดูแล" ห้ามหารเข้าคนอื่น'
